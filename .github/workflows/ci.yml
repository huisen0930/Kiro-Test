name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest
    # The durable repository uses Node's built-in node:sqlite (see the "start"
    # script). It needs Node >= 22, and the --experimental-sqlite flag on 22.
    env:
      NODE_OPTIONS: --experimental-sqlite
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Lint (ESLint)
        run: npm run lint:eslint

      - name: Format check (Prettier)
        run: npm run format

      - name: Build
        run: npm run build

      - name: Test + coverage
        run: npm run coverage

      - name: Dependency audit (informational, non-blocking)
        run: npm audit --audit-level=high || true
