name: CI

# Server-side counterpart to the local .kiro/hooks/verify-after-task hook:
# the hook keeps your machine honest, CI keeps the shared branch honest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / build / test
    runs-on: ubuntu-latest
    # node:sqlite (task 11) needs Node 22.5+. The flag is required on Node 22 and
    # accepted as a no-op on Node 24, so setting it here lets both matrix legs
    # exercise the SQLite repositories.
    env:
      NODE_OPTIONS: --experimental-sqlite
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
